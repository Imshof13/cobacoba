<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - La Fleur a Tory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Custom Color menyesuaikan gambar asli */
        .bg-sidebar { background-color: #2c3e50; } /* Dark Blue/Grey */
        .bg-header { background-color: #34495e; }
        .active-menu { background-color: #ffffff; color: #2c3e50; font-weight: bold; border-radius: 8px; }
        .inactive-menu { color: #ecf0f1; }
        .inactive-menu:hover { background-color: #3e5871; border-radius: 8px; }
        .btn-logout { background-color: #e74c3c; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="flex h-screen">
        
        <aside class="w-64 bg-sidebar text-white flex flex-col transition-all duration-300">
            <div class="h-16 flex items-center pl-6 text-2xl font-serif italic tracking-wider border-b border-gray-600">
                La Fleur a Tory
            </div>

            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="#" class="active-menu flex items-center px-4 py-3">
                    <i class="fas fa-tachometer-alt w-6"></i>
                    <span>Dashboard</span>
                </a>

                <a href="#" class="inactive-menu flex items-center justify-between px-4 py-3">
                    <div class="flex items-center">
                        <i class="fas fa-chart-bar w-6"></i>
                        <span>Kasir</span>
                    </div>
                    <i class="fas fa-chevron-right text-xs"></i>
                </a>

                <a href="#" class="inactive-menu flex items-center px-4 py-3">
                    <i class="fas fa-box-open w-6"></i>
                    <span>Tambah Produk</span>
                </a>

                <a href="#" class="inactive-menu flex items-center justify-between px-4 py-3">
                    <div class="flex items-center">
                        <i class="fas fa-boxes w-6"></i>
                        <span>Stok</span>
                    </div>
                    <i class="fas fa-chevron-right text-xs"></i>
                </a>

                <a href="#" class="inactive-menu flex items-center px-4 py-3">
                    <i class="fas fa-undo-alt w-6"></i>
                    <span>Retur</span>
                </a>

                <a href="#" class="inactive-menu flex items-center px-4 py-3">
                    <i class="fas fa-file-alt w-6"></i>
                    <span>Laporan</span>
                </a>

                <a href="#" class="inactive-menu flex items-center px-4 py-3">
                    <i class="fas fa-store w-6"></i>
                    <span>Tambah Cabang</span>
                </a>
            </nav>

            <div class="p-4">
                <button class="btn-logout w-full text-white py-2 rounded shadow hover:bg-red-700 transition flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            
            <header class="bg-header text-white shadow-md h-16 flex items-center justify-between px-6">
                <div>
                    <h2 class="text-lg font-bold">Cabang Pusat</h2>
                    <p class="text-xs text-gray-300">Halo, [Nama User]!</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="p-2 hover:bg-gray-600 rounded-full"><i class="fas fa-headset"></i></button>
                    <div class="w-8 h-8 bg-gray-500 rounded-full flex items-center justify-center text-sm">U</div>
                </div>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white rounded-lg shadow p-5 border-l-4 border-green-500">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-500 text-sm font-medium">Penjualan Hari Ini</p>
                                <h3 class="text-2xl font-bold text-gray-800">Rp 1.250.000</h3>
                            </div>
                            <div class="bg-green-100 p-3 rounded-full text-green-600">
                                <i class="fas fa-money-bill-wave fa-lg"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-5 border-l-4 border-blue-500">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-500 text-sm font-medium">Total Stok Roti</p>
                                <h3 class="text-2xl font-bold text-gray-800">850 Pcs</h3>
                            </div>
                            <div class="bg-blue-100 p-3 rounded-full text-blue-600">
                                <i class="fas fa-cubes fa-lg"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-5 border-l-4 border-red-500">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-500 text-sm font-medium">Perlu Retur</p>
                                <h3 class="text-2xl font-bold text-red-600">12 Pcs</h3>
                                <p class="text-xs text-red-400">Kadaluarsa hari ini</p>
                            </div>
                            <div class="bg-red-100 p-3 rounded-full text-red-600">
                                <i class="fas fa-exclamation-triangle fa-lg"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-5 border-l-4 border-orange-500">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-gray-500 text-sm font-medium">Total Cabang</p>
                                <h3 class="text-2xl font-bold text-gray-800">4 Outlet</h3>
                            </div>
                            <div class="bg-orange-100 p-3 rounded-full text-orange-600">
                                <i class="fas fa-store-alt fa-lg"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    
                    <div class="bg-white rounded-lg shadow p-6">
                        <h3 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Tren Penjualan (Mingguan)</h3>
                        <div class="relative h-64">
                            <canvas id="salesChart"></canvas>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex justify-between items-center mb-4 border-b pb-2">
                            <h3 class="text-lg font-bold text-gray-700">Distribusi Stok per Cabang</h3>
                            <button class="text-xs bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">Lihat Detail</button>
                        </div>
                        <div class="relative h-64">
                            <canvas id="stockChart"></canvas>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <script>
        // 1. Grafik Penjualan
        const ctxSales = document.getElementById('salesChart').getContext('2d');
        new Chart(ctxSales, {
            type: 'line',
            data: {
                labels: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'],
                datasets: [{
                    label: 'Penjualan (Ribuan Rp)',
                    data: [1200, 1900, 1500, 2200, 1800, 2800, 3100],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // 2. Grafik Stok
        const ctxStock = document.getElementById('stockChart').getContext('2d');
        new Chart(ctxStock, {
            type: 'bar',
            data: {
                labels: ['Cabang Pusat', 'Cabang A', 'Cabang B', 'Cabang C'],
                datasets: [{
                    label: 'Jumlah Stok Roti',
                    data: [320, 210, 180, 140],
                    backgroundColor: [
                        '#2c3e50', '#34495e', '#7f8c8d', '#95a5a6'
                    ]
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    </script>
</body>
</html>
